[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-onboarding-harness"
# Deliberately independent of the CLAUDE.md version, which is currently ahead of
# this one. They answer different questions: this is the version of the *code*,
# and CLAUDE.md's is the version of the *constitutional decisions* the code was
# written against. Several kernel releases can sit against one spec version, and
# a spec change that no code has caught up with yet is an ordinary state rather
# than an error -- so holding the two in lockstep would buy bookkeeping and
# nothing else. A run records both (CLAUDE.md 12, kernel/run_manifest.py), which
# is where the pair is meant to be read together. The gap is the design, not
# drift; do not "sync" them.
version = "0.4.0"
description = "MAXENG Data Onboarding Harness"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    # Not a real classifier. PyPI rejects unknown classifiers, so this makes an
    # accidental `twine upload` fail instead of publishing a proprietary repo
    # that carries tr-core. Do not remove without a deliberate decision to
    # publish, and do not "fix" it to a valid classifier.
    "Private :: Do Not Upload",
]
dependencies = [
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pydantic>=2.6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
harness = "kernel.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernel*", "discovery*", "references*", "schemas*", "packs*"]