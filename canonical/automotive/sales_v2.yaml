id: automotive/sales_v2

# Gate 1's target schema, and the one CLAUDE.md §7.1's manifest example maps
# onto. Four of these fields are the right-hand side of that example's
# column_map, so this artifact is what makes that example resolvable at all.
#
# Note order_date beside delivery_date: this pair is why §7.6 requires
# freshness_field to be declared rather than inferred from "the only date-typed
# field". Inference would silently pick one, and the two answer different
# questions -- an extract is fresh with respect to when orders were taken, not
# to when cars happened to be handed over.
#
# **The entity here is not settled.** §7.6 says entities are named by role, and
# this schema has not answered which role a row plays: a vehicle, an order line,
# or a delivery. `vehicle_sale` is a placeholder that reads as "one sale of one
# vehicle", and `key: [chassis_no]` presumes one sale per vehicle -- which is
# false the first time a car is resold. Naming it before answering it is how a
# canonical schema acquires a client's org chart, so it is recorded as open in
# docs/STATUS.md rather than settled here by default.
grain:
  entity: vehicle_sale
  period: instant
  layout: wide

fields:
  - name: chassis_no
    semantic_type: chassis_no
    required: true

  - name: brand
    semantic_type: brand
    required: true

  - name: model
    semantic_type: model
    required: false

  - name: order_date
    semantic_type: date
    required: true

  - name: delivery_date
    semantic_type: date
    required: false

  - name: customer_msisdn
    semantic_type: phone_mobile
    required: false

  - name: sale_amount
    semantic_type: currency_amount
    required: false

  - name: province_code
    semantic_type: province_code
    required: false

key: [chassis_no]
freshness_field: order_date
